# ========================================
# Docker 环境专用配置文件
# ========================================

# MySQL DataSource Configuration - 使用 Docker 网络中的 MySQL 服务名
spring.datasource.url=jdbc:mysql://mysql:3306/bookstore_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=bookstore123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# 连接池配置
spring.datasource.hikari.connection-timeout=60000
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=600000

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true
# 延迟初始化，等待数据库就绪
spring.jpa.defer-datasource-initialization=true

# Server Port
server.port=8080

# JWT Configuration
bookstore.app.jwtSecret=YourSuperSecretKeyForDevelopmentWhichIsLongAndSecureEnoughForHS512
bookstore.app.jwtExpirationMs=86400000

# Custom application properties
file.upload-dir=/app/uploads/avatars
logging.level.root=INFO
logging.level.com.bookstore.online_bookstore_backend=INFO

# ========================================
# 禁用 Kafka 和 Redis 自动配置
# 在Docker简化部署中，仅使用MySQL
# ========================================
spring.autoconfigure.exclude=\
  org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration,\
  org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration,\
  org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration

# 禁用 Kafka 功能
spring.kafka.enabled=false

# 禁用缓存功能
bookstore.cache.enabled=false

