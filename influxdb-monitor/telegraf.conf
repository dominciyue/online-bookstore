# Telegraf Configuration for System Monitoring
# 用于监控笔记本电脑状态（Docker 环境）

# 全局配置
[global_tags]
  host = "windows-laptop"

[agent]
  interval = "10s"
  round_interval = true
  metric_batch_size = 1000
  metric_buffer_limit = 10000
  collection_jitter = "0s"
  flush_interval = "10s"
  flush_jitter = "0s"
  precision = "0s"
  hostname = "my-laptop"
  omit_hostname = false

###############################################################################
#                            OUTPUT PLUGINS                                   #
###############################################################################

# 输出到 InfluxDB 2.x
[[outputs.influxdb_v2]]
  urls = ["http://influxdb:8086"]
  token = "my-super-secret-auth-token"
  organization = "myorg"
  bucket = "system_metrics"

###############################################################################
#                            INPUT PLUGINS                                    #
###############################################################################

# CPU 使用率监控
[[inputs.cpu]]
  percpu = true
  totalcpu = true
  collect_cpu_time = false
  report_active = false

# 内存使用监控
[[inputs.mem]]
  # no configuration

# 磁盘使用监控
[[inputs.disk]]
  ignore_fs = ["tmpfs", "devtmpfs", "devfs", "iso9660", "overlay", "aufs", "squashfs"]

# 磁盘 I/O 监控
[[inputs.diskio]]
  # no configuration

# 网络监控
[[inputs.net]]
  # no configuration

# 系统负载监控
[[inputs.system]]
  # no configuration

# 进程监控
[[inputs.processes]]
  # no configuration

# 交换空间监控
[[inputs.swap]]
  # no configuration

# Docker 容器统计（已禁用，Windows 权限问题）
# [[inputs.docker]]
#   endpoint = "unix:///var/run/docker.sock"

